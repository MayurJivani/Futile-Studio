<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark at tab size: the "f" of futile, heavy enough to survive 16px,
       and the red dot that sits after it in the wordmark. Tilted like the
       wordmark, on an ink tile so it holds against light and dark tab bars. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#1b2132"/>
  <g transform="rotate(-8 16 16)" fill="none" stroke="#f2eee5" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 25V12.5a5 5 0 0 1 5-5h2.5"/>
    <path d="M8 15h10"/>
  </g>
  <circle cx="23" cy="23.5" r="3.6" fill="#e2553c"/>
</svg>
