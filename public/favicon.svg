<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<!-- Guideline B: a note pinned to kraft paper. Three shapes only, so it
	     still reads as a pinned note at 16px. -->
	<rect width="128" height="128" rx="26" fill="#ece2cd"/>

	<!-- the note, tacked up slightly crooked, with a flat hard-offset shadow -->
	<g transform="rotate(-6 64 68)">
		<rect x="27" y="30" width="74" height="76" rx="6" fill="#1b2132" opacity="0.26" transform="translate(5 5)"/>
		<rect x="27" y="30" width="74" height="76" rx="6" fill="#fbf8f0" stroke="#1b2132" stroke-width="5"/>
		<!-- two ruled lines: they vanish into texture at small sizes, which is fine -->
		<g stroke="#1b2132" stroke-width="5" stroke-linecap="round" opacity="0.5">
			<line x1="41" y1="58" x2="87" y2="58"/>
			<line x1="41" y1="76" x2="74" y2="76"/>
		</g>
	</g>

	<!-- the drawing pin, the one bit of colour -->
	<circle cx="64" cy="29" r="14" fill="#c2452d" stroke="#1b2132" stroke-width="5"/>
	<circle cx="59" cy="24" r="4" fill="#fbf8f0" opacity="0.9"/>
</svg>
